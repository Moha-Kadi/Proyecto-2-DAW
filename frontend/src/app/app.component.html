<!-- Cabecera: solo visible fuera de login y registro -->
@if (mostrarCabeceraPie) {
  <app-header/>
}

<!-- Contenido principal -->
<main class="min-h-[calc(100vh-64px)] flex flex-col"
      [class.min-h-screen]="!mostrarCabeceraPie">
  <router-outlet/>
</main>

<!-- Pie de pagina -->
@if (mostrarCabeceraPie) {
  <app-footer/>
}

<!-- Notificaciones toast -->
<app-toasts/>
