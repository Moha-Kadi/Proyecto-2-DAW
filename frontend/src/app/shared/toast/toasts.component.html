<div class="fixed top-5 right-5 z-[9999] flex flex-col gap-3 pointer-events-none">
  @for (n of toast.notificaciones(); track n.id) {
    <div
      class="pointer-events-auto min-w-[320px] max-w-[420px] flex items-center gap-3 p-4 rounded-xl border shadow-xl transition-all"
      [class.bg-green-50]="n.tipo === 'exito'"
      [class.border-green-200]="n.tipo === 'exito'"
      [class.text-green-800]="n.tipo === 'exito'"
      [class.bg-red-50]="n.tipo === 'error'"
      [class.border-red-200]="n.tipo === 'error'"
      [class.text-red-800]="n.tipo === 'error'">

      <!-- Icono -->
      <div class="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center"
           [class.bg-green-100]="n.tipo === 'exito'"
           [class.text-green-600]="n.tipo === 'exito'"
           [class.bg-red-100]="n.tipo === 'error'"
           [class.text-red-600]="n.tipo === 'error'">
        @if (n.tipo === 'exito') {
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
          </svg>
        } @else {
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v3m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
          </svg>
        }
      </div>

      <span class="flex-1 text-sm font-bold tracking-tight">{{ n.mensaje }}</span>

      <button (click)="toast.ocultar(n.id)"
        class="flex-shrink-0 p-1 rounded-lg transition-colors hover:bg-black/5"
        [class.text-green-400]="n.tipo === 'exito'"
        [class.text-red-400]="n.tipo === 'error'">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  }
</div>
