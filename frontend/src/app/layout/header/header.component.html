<!-- Cabecera fija -->
<header class="sticky top-0 z-50 bg-white shadow-md border-b border-gray-100">
  <div class="max-w-7xl mx-auto px-6 flex items-center justify-between h-20">

    <!-- Logo con link al inicio -->
    <a routerLink="/" class="flex items-center gap-3 flex-shrink-0 group">
      <img src="assets/beinscore-logo.png" alt="BeinScore"
        class="h-10 w-auto object-contain group-hover:scale-105 transition-transform duration-200" />
      <span class="text-gray-900 font-black text-2xl tracking-tighter uppercase">
        Bein<span class="text-red-600">Score</span>
      </span>
    </a>

    <!-- Navegacion en desktop: Home y Scores -->
    <nav class="hidden md:flex items-center gap-1 bg-gray-50 p-1 rounded-xl border border-gray-100">
      <a routerLink="/" routerLinkActive="bg-white text-gray-900 shadow-sm ring-1 ring-black/5"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-2 px-5 py-2 rounded-lg text-base font-bold text-gray-500 hover:text-gray-900 transition-all duration-200">
        Home
      </a>
      <a routerLink="/scores" routerLinkActive="bg-white text-gray-900 shadow-sm ring-1 ring-black/5"
        class="flex items-center gap-2 px-5 py-2 rounded-lg text-base font-bold text-gray-500 hover:text-gray-900 transition-all duration-200">
        Scores
      </a>
    </nav>

    <!-- Lado derecho: login o avatar con dropdown -->
    <div class="flex items-center gap-4">

      <!-- Sin sesion: boton de Login -->
      @if (!sesionActiva()) {
      <a routerLink="/login"
        class="px-6 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white text-base font-bold shadow-lg shadow-red-600/20 transition-all duration-200 active:scale-95">
        Login
      </a>
      } @else {
      <!-- Con sesion: avatar + dropdown al hacer hover -->
      <div class="relative group">

        <!-- Boton con nombre y avatar -->
        <button type="button"
          class="flex items-center gap-3 pl-4 pr-1.5 py-1.5 rounded-full bg-slate-50 border border-slate-200 hover:bg-slate-100 hover:bg-slate-100 hover:border-slate-300 transition-all duration-200">
          <span class="hidden sm:block text-xs font-black text-slate-700">
            {{ nombreUsuario() }}
          </span>
          <div
            class="w-8 h-8 rounded-full bg-white border border-slate-200 flex items-center justify-center overflow-hidden shadow-sm flex-shrink-0">
            <img [src]="avatarUsuario()" alt="Avatar" class="w-full h-full object-cover" />
          </div>
        </button>

        <!-- Dropdown: solo visible al hacer hover sobre el grupo -->
        <div
          class="absolute right-0 top-full pt-2 w-56 opacity-0 invisible group-hover:opacity-100 group-hover:visible translate-y-2 group-hover:translate-y-0 transition-all duration-200 z-50">
          <div class="bg-white rounded-2xl shadow-2xl border border-slate-100 overflow-hidden">
            
            <!-- Cabecera del dropdown: avatar, nombre y email -->
            <div class="px-5 py-4 bg-slate-50 border-b border-slate-100 flex items-center gap-3">
              <div
                class="w-10 h-10 rounded-full bg-white border border-gray-200 flex-shrink-0 flex items-center justify-center overflow-hidden">
                <img [src]="avatarUsuario()" alt="Avatar" class="w-full h-full object-cover" />
              </div>
              <div class="min-w-0">
                <p class="text-sm font-bold text-gray-900 truncate">{{ nombreUsuario() }}</p>
                <p class="text-[11px] font-medium text-gray-500 truncate">{{ emailUsuario() }}</p>
              </div>
            </div>

            <!-- Opciones del dropdown -->
            <div class="p-2">
              <!-- Mi Perfil -->
              <a routerLink="/account"
                class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-semibold text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors">
                <div class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center text-blue-600">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                  </svg>
                </div>
                Mi Perfil
              </a>

              <!-- Admin: solo visible si el usuario es admin -->
              @if (esAdmin()) {
              <a routerLink="/admin"
                class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-semibold text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors">
                <div class="w-8 h-8 rounded-lg bg-purple-50 flex items-center justify-center text-purple-600">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  </svg>
                </div>
                Admin
              </a>
              }

              <!-- Cerrar sesion -->
              <button type="button" (click)="cerrarSesion()"
                class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-semibold text-red-600 hover:bg-red-50 transition-colors text-left">
                <div class="w-8 h-8 rounded-lg bg-red-50 flex items-center justify-center">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                  </svg>
                </div>
                Cerrar sesion
              </button>
            </div>
          </div>
        </div>
      </div>
      }

      <!-- Boton hamburguesa: visible solo en movil -->
      <button type="button"
        class="md:hidden p-2 rounded-xl text-gray-400 hover:text-gray-900 hover:bg-gray-100 transition-all"
        (click)="alternarMenu()">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          @if (menuAbierto) {
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          } @else {
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
          }
        </svg>
      </button>

    </div>
  </div>

  <!-- Menu desplegable movil: Home, Scores, Mi Cuenta, Admin, Cerrar sesion -->
  @if (menuAbierto) {
  <div class="md:hidden border-t border-gray-100 bg-white px-6 py-4 space-y-2 shadow-xl">
    <a routerLink="/"
      class="block px-4 py-3 rounded-xl text-base font-bold text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-all"
      (click)="cerrarMenu()">Home</a>
    <a routerLink="/scores"
      class="block px-4 py-3 rounded-xl text-base font-bold text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-all"
      (click)="cerrarMenu()">Scores</a>
    @if (sesionActiva()) {
    <div class="h-px bg-gray-100 my-2"></div>
    <a routerLink="/account"
      class="block px-4 py-3 rounded-xl text-base font-bold text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-all"
      (click)="cerrarMenu()">Mi Cuenta</a>
    @if (esAdmin()) {
    <a routerLink="/admin"
      class="block px-4 py-3 rounded-xl text-base font-bold text-purple-600 hover:bg-purple-50 transition-all"
      (click)="cerrarMenu()">Panel Admin</a>
    }
    <button (click)="cerrarSesion()"
      class="w-full text-left px-4 py-3 rounded-xl text-base font-bold text-red-600 hover:bg-red-50 transition-all">Cerrar sesion</button>
    } @else {
    <a routerLink="/login"
      class="block px-4 py-3 rounded-xl text-base font-bold bg-red-600 text-white text-center shadow-lg shadow-red-600/20"
      (click)="cerrarMenu()">Login</a>
    }
  </div>
  }
</header>
