# Balanceador de carga: reparte peticiones entre 3 backends
upstream backend_pool {
    server backend1:8000;
    server backend2:8000;
    server backend3:8000;
}

# Servidor principal (puerto 80)
server {
    listen 80;
    server_name localhost;

    # Peticiones API -> Backend (balanceado)
    location /api/ {
        proxy_pass http://backend_pool/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Documentacion Swagger UI -> Backend
    location /docs {
        proxy_pass http://backend_pool/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # OpenAPI schema (requerido por /docs)
    location /openapi.json {
        proxy_pass http://backend_pool/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Resto de peticiones -> Frontend Angular
    location / {
        proxy_pass http://frontend-dev:4200/;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Tolerancia a fallos: reintenta si el frontend esta compilando
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 5;
        proxy_next_upstream_timeout 15s;
    }
}
